name: Build social preview
on:
  push:
    paths:
      - sponsor-preview-v3.svg
      - .github/workflows/build-social-preview.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-noto-core fonts-noto-cjk
      - name: Render PNG
        run: rsvg-convert -w 1200 -h 630 sponsor-preview-v3.svg -o sponsor-preview-v3.png
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sponsor-preview-v3.png
          git diff --cached --quiet || git commit -m "Render social preview image"
          git push
